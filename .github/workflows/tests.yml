name: Tests & Lint

# المهمة 6: pytest (بمحاكاة كاملة — لا أوامر حقيقية) + ruff على كل PR
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: pytest (unit, mocked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint (config in pyproject.toml)
        run: ruff check .

      - name: Bash syntax check (existing lint.yml complement)
        run: |
          for f in install.sh uninstall.sh; do
            bash -n "$f"
          done
          # نقطة الدخول manjaro-care سكربت بايثون (وليست bash) — فحصها الصحيح هنا
          python3 -m py_compile manjaro-care


  bash-tests:
    name: bash modules (syntax + diagnostic guards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check (CLI tree)
        run: |
          FAIL=0
          for f in manjaro-care-cli/manjaro-care-cli manjaro-care-cli/modules/*.sh manjaro-care-cli/tests/*.sh; do
            if bash -n "$f" 2>&1; then
              echo "OK: $f"
            else
              echo "FAIL: $f"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Diagnostic correctness guards (BUG-CLI-01..06)
        run: bash manjaro-care-cli/tests/diagnostic-correctness.sh

      - name: Safety regression guards
        run: bash manjaro-care-cli/tests/safety-regression.sh
